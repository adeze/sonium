[package]
name = "sonium-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Keep cargo-fuzz's package independent from the main workspace. This avoids
# adding libfuzzer-sys to normal workspace builds.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
num-complex = "0.4"
serde_json = "1"
sonium-fastmath = { path = "../crates/sonium-fastmath" }
sonium-fft = { path = "../crates/sonium-fft" }
sonium-bem = { path = "../crates/sonium-bem" }
sonium-xem = { path = "../crates/sonium-xem" }
sonium-compute = { path = "../crates/sonium-compute" }
sonium-solvers = { path = "../crates/sonium-solvers" }

[[bin]]
name = "fastmath_sincos"
path = "fuzz_targets/fastmath_sincos.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fft_planner"
path = "fuzz_targets/fft_planner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bem_nc_parser"
