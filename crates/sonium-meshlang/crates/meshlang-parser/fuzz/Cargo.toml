[package]
name = "meshlang-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
meshlang-parser = { path = ".." }

[[bin]]
name = "parse_recovering"
path = "fuzz_targets/parse_recovering.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_recovering_invariants"
path = "fuzz_targets/parse_recovering_invariants.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
