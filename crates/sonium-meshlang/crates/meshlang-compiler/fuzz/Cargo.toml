[package]
name = "meshlang-compiler-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
meshlang-ast = { path = "../../meshlang-ast" }
meshlang-compiler = { path = ".." }
meshlang-parser = { path = "../../meshlang-parser" }

[[bin]]
name = "compiler_pipeline"
path = "fuzz_targets/compiler_pipeline.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
